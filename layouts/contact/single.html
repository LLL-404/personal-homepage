{{ define "main" }}
<!-- 联系页 -->
<section class="section contact" id="contact">
    <h2 class="contact-title">{{ i18n "contact_title" }}</h2>
    <ul class="contact-links">
        {{ with .Site.Params.email }}
        <li><a class="contact-link" href="mailto:{{ . }}">{{ . }}</a></li>
        {{ end }}
        <li><a class="contact-link" href="{{ .Site.Params.github }}" target="_blank">GitHub</a></li>
    </ul>
</section>
{{ end }}
