<style>
/* ========== NEO-BRUTALISM v5 ========== */
:root { --ink:#000; --paper:#fffdf5; --y:#ffd93d; --pk:#ff90e8; --cy:#7ff3ff; --gn:#b8f53d;
    --sans:'Noto Sans SC',sans-serif; --disp:'Archivo Black','Noto Sans SC',sans-serif; --b:3px; --sh:6px 6px 0 var(--ink); }
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth;-webkit-text-size-adjust:100%}
body{font-family:var(--sans);background:var(--paper);color:var(--ink);line-height:1.65;font-size:15px;-webkit-font-smoothing:antialiased;overflow-x:hidden}
a{color:inherit;text-decoration:none} img{max-width:100%;display:block}
::selection{background:var(--ink);color:var(--y)}
.wrap{max-width:1100px;margin:0 auto;padding:0 22px}

/* 顶部黑带字跑马灯 */
.mq{background:var(--ink);color:var(--y);overflow:hidden;white-space:nowrap;font-family:var(--disp);font-size:.72rem;letter-spacing:.14em;padding:9px 0;border-bottom:var(--b) solid var(--ink)}
.mq-t{display:inline-block;animation:mq 26s linear infinite}
.mq-t span{margin:0 20px} .mq-t i{font-style:normal;color:var(--pk)}
@keyframes mq{to{transform:translateX(-50%)}}

/* 导航行 */
.navrow{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:14px 22px;border-bottom:var(--b) solid var(--ink);position:sticky;top:0;background:var(--paper);z-index:50}
.brand{font-family:var(--disp);font-size:1.15rem;letter-spacing:-.02em;display:flex;align-items:baseline;gap:10px}
.brand small{font-family:var(--sans);font-weight:700;font-size:.62rem;background:var(--cy);border:2px solid var(--ink);padding:1px 7px;box-shadow:3px 3px 0 var(--ink)}
.nlinks{display:flex;gap:10px;align-items:center}
.nlink{font-family:var(--disp);font-size:.72rem;letter-spacing:.06em;border:2px solid var(--ink);background:var(--paper);padding:6px 12px;box-shadow:3px 3px 0 var(--ink);transition:transform .12s,box-shadow .12s}
.nlink:hover{transform:translate(-2px,-2px);box-shadow:5px 5px 0 var(--ink)}
.nlink.on{background:var(--y)}
.nlink.gh{background:var(--gn)}
.burger{display:none;border:var(--b) solid var(--ink);background:var(--y);box-shadow:4px 4px 0 var(--ink);width:44px;height:40px;cursor:pointer}
.burger span{display:block;width:20px;height:3px;background:var(--ink);margin:4px auto}
.mnav{position:fixed;inset:0;background:var(--ink);z-index:90;display:none;flex-direction:column;gap:6px;padding:80px 26px}
.mnav.open{display:flex}
.mnav a{color:var(--paper);font-family:var(--disp);font-size:2rem;border-bottom:2px solid #333;padding:12px 0}
.mnav a:hover{color:var(--y)}
.mclose{position:absolute;top:20px;right:20px;background:var(--y);border:var(--b) solid var(--ink);box-shadow:4px 4px 0 #444;font-family:var(--disp);padding:8px 14px;cursor:pointer}

/* Hero */
.hero{padding:72px 0 64px;border-bottom:var(--b) solid var(--ink);position:relative}
.badge{position:absolute;right:6%;top:34px;transform:rotate(7deg);font-family:var(--disp);font-size:.66rem;letter-spacing:.1em;background:var(--pk);border:2px solid var(--ink);box-shadow:4px 4px 0 var(--ink);padding:7px 12px}
h1{font-family:var(--disp);font-size:clamp(2.1rem,6.4vw,4.3rem);line-height:1.18;letter-spacing:-.01em}
.hl{background:var(--y);padding:0 .18em;border:var(--b) solid var(--ink);box-shadow:var(--sh);display:inline-block;transform:rotate(-.6deg)}
.ul{box-shadow:inset 0 -.38em 0 var(--cy)}
.sub{max-width:560px;margin-top:26px;font-size:1rem;color:#222}
.acts{display:flex;gap:14px;margin-top:30px;flex-wrap:wrap}
.bb{display:inline-block;font-family:var(--disp);font-size:.8rem;letter-spacing:.05em;border:var(--b) solid var(--ink);box-shadow:var(--sh);padding:12px 20px;transition:transform .12s,box-shadow .12s}
.bb:hover{transform:translate(-3px,-3px);box-shadow:9px 9px 0 var(--ink)}
.bb.y{background:var(--y)} .bb.p{background:var(--pk)} .bb.c{background:var(--cy)} .bb.g{background:var(--gn)}

/* 区块标签 */
.lab{display:inline-block;background:var(--ink);color:var(--paper);font-family:var(--disp);font-size:.72rem;letter-spacing:.12em;padding:7px 14px;transform:rotate(-1.2deg);margin-bottom:34px}
.sec{padding:66px 0;border-bottom:var(--b) solid var(--ink)}

/* 项目卡 */
.wgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:20px}
.wc{border:var(--b) solid var(--ink);background:#fff;box-shadow:var(--sh);display:flex;flex-direction:column;transition:transform .14s,box-shadow .14s}
.wc:hover{transform:translate(-4px,-4px);box-shadow:10px 10px 0 var(--ink)}
.wc:nth-child(3n+1) .wh{background:var(--y)} .wc:nth-child(3n+2) .wh{background:var(--cy)} .wc:nth-child(3n) .wh{background:var(--pk)}
.wh{border-bottom:var(--b) solid var(--ink);padding:10px 14px;display:flex;justify-content:space-between;align-items:center;font-family:var(--disp);font-size:.68rem;letter-spacing:.08em}
.wb{padding:16px 16px 18px;display:flex;flex-direction:column;gap:10px;flex:1}
.wb .t{font-family:var(--disp);font-size:1.06rem}
.wb .d{font-size:.84rem;color:#333;flex:1}
.tags{display:flex;gap:6px;flex-wrap:wrap}
.tag{font-size:.62rem;font-weight:700;border:2px solid var(--ink);padding:2px 8px;background:var(--paper)}
.wc .tags .tag:nth-child(1){background:var(--gn)}

/* 足迹卡 */
.jgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:20px}
.jc{border:var(--b) solid var(--ink);box-shadow:var(--sh);padding:18px;transition:transform .14s,box-shadow .14s}
.jc:hover{transform:translate(-3px,-3px);box-shadow:9px 9px 0 var(--ink)}
.jc:nth-child(1){background:var(--cy)} .jc:nth-child(2){background:var(--pk)} .jc:nth-child(3){background:var(--gn)}
.jc .t{font-family:var(--disp);font-size:.95rem;margin-bottom:8px}
.jc .d{font-size:.82rem;color:#1c1c1c}

/* CTA */
.cta{padding:80px 0}
.cta .box{border:var(--b) solid var(--ink);background:var(--y);box-shadow:10px 10px 0 var(--ink);padding:46px 36px;text-align:center}
.cta h2{font-family:var(--disp);font-size:clamp(1.6rem,4.5vw,2.8rem);line-height:1.25}
.cta p{margin:12px 0 24px;font-weight:700}

/* footer */
footer{border-top:var(--b) solid var(--ink);padding:20px 0 54px}
footer .fin{display:flex;justify-content:space-between;font-family:var(--disp);font-size:.66rem;letter-spacing:.06em;flex-wrap:wrap;gap:8px}

/* 列表页 */
.pagehead{padding:56px 0 34px}
.ptitle{font-family:var(--disp);font-size:clamp(1.9rem,5.5vw,3.2rem)}
.ptitle em{font-style:normal;background:var(--y);border:var(--b) solid var(--ink);box-shadow:var(--sh);padding:0 .15em;display:inline-block;transform:rotate(-.5deg)}
.lead{max-width:600px;margin-top:16px;color:#333}
.rows{display:flex;flex-direction:column;gap:16px;padding-bottom:64px}
.postrow{border:var(--b) solid var(--ink);background:#fff;box-shadow:var(--sh);padding:18px 20px;display:flex;justify-content:space-between;align-items:center;gap:16px;transition:transform .12s,box-shadow .12s}
.postrow:hover{transform:translate(-3px,-3px);box-shadow:9px 9px 0 var(--ink)}
.postrow .t{font-family:var(--disp);font-size:1rem}
.postrow .dt{font-size:.72rem;font-weight:700;white-space:nowrap;border:2px solid var(--ink);background:var(--cy);padding:2px 9px}
.grid2{display:grid;grid-template-columns:repeat(2,1fr);gap:20px;padding-bottom:64px}

/* 单页 */
.shead{padding:56px 0 30px;border-bottom:var(--b) solid var(--ink);position:relative}
.stitle{font-family:var(--disp);font-size:clamp(1.8rem,5vw,3rem);background:var(--y);border:var(--b) solid var(--ink);box-shadow:var(--sh);display:inline-block;padding:4px 18px;transform:rotate(-.5deg)}
.smeta{display:flex;gap:8px;flex-wrap:wrap;margin-top:20px}
.sdesc{margin-top:16px;max-width:640px;font-weight:500;color:#222}
.prose{padding:38px 0 72px;max-width:760px}
.prose h2{font-family:var(--disp);font-size:1.3rem;border-bottom:var(--b) solid var(--ink);padding-bottom:8px;margin:34px 0 14px}
.prose h3{font-family:var(--disp);font-size:1.05rem;margin:26px 0 10px}
.prose p{margin:12px 0}
.prose a{border-bottom:3px solid var(--ink);font-weight:700}
.prose a:hover{background:var(--y)}
.prose ul{margin:12px 0 12px 4px;list-style:none}
.prose li{padding-left:22px;position:relative;margin:8px 0}
.prose li::before{content:"▸";position:absolute;left:0;font-weight:900}
.prose code{font-family:'JetBrains Mono',monospace;font-size:.82em;background:var(--ink);color:var(--gn);padding:2px 7px}
.prose pre{background:var(--ink);color:var(--paper);border:var(--b) solid var(--ink);box-shadow:var(--sh);padding:16px;overflow-x:auto;margin:16px 0}
.prose pre code{background:transparent;color:var(--paper);padding:0}
.prose blockquote{border:var(--b) solid var(--ink);background:var(--pk);box-shadow:var(--sh);padding:14px 18px;margin:16px 0;font-weight:700}
.prose img{border:var(--b) solid var(--ink);box-shadow:var(--sh);margin:18px 0}
.backrow{padding:0 0 70px}
.tchips{display:flex;gap:6px;flex-wrap:wrap}
.tchip{font-size:.66rem;font-weight:700;border:2px solid var(--ink);background:var(--gn);padding:3px 9px}

/* 404 */
.nf{min-height:62vh;display:flex;flex-direction:column;align-items:flex-start;justify-content:center;gap:18px;padding:60px 22px}
.nf .n{font-family:var(--disp);font-size:clamp(4rem,16vw,9rem);background:var(--y);border:var(--b) solid var(--ink);box-shadow:10px 10px 0 var(--ink);padding:0 24px;transform:rotate(-1deg)}

/* 渐入 */
.rv{opacity:0;transform:translateY(26px) rotate(-.4deg)}
.rv.in{opacity:1;transform:translateY(0) rotate(0);transition:opacity .55s var(--e, ease),transform .55s var(--e, ease)}
.rv{--e:cubic-bezier(.19,1,.22,1)}
.d1{transition-delay:.08s} .d2{transition-delay:.16s} .d3{transition-delay:.24s}
@media (prefers-reduced-motion:reduce){.rv{opacity:1;transform:none;transition:none}.mq-t{animation:none}}

@media (max-width:860px){
    .nlinks{display:none} .burger{display:block}
    .wgrid,.jgrid{grid-template-columns:1fr} .grid2{grid-template-columns:1fr}
    .badge{position:static;display:inline-block;transform:rotate(2deg);margin-bottom:18px}
    .hero{padding:44px 0 50px}
}
</style>
