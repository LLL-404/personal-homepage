{{ define "main" }}
<!-- 博客详情页 -->
<article class="section">
    <span class="section-label">{{ .Date.Format "2006.01.02" }}</span>
    <h2 class="section-title">{{ .Title }}</h2>
    {{ if .TableOfContents }}
    <aside class="toc">{{ .TableOfContents }}</aside>
    {{ end }}
    <div class="article-content">{{ .Content }}</div>
</article>
{{ end }}
