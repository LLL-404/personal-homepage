{{ define "main" }}
<!-- 博客列表页 -->
<section class="section" id="blog">
    <span class="section-label">{{ i18n "blog_label" }}</span>
    <h2 class="section-title">{{ i18n "blog_title" }}</h2>
    <div class="blog-list">
        {{ range .Pages }}
        <a href="{{ .RelPermalink }}" class="blog-item">
            <time class="blog-date">{{ .Date.Format "2006.01.02" }}</time>
            <div class="blog-main">
                <h3 class="blog-title">{{ .Title }}</h3>
                <p class="blog-excerpt">{{ .Description }}</p>
            </div>
            <span class="blog-arrow">→</span>
        </a>
        {{ end }}
    </div>
</section>
{{ end }}
